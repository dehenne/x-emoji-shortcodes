<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">X Emoji Shortcodes</title>
  <desc id="desc">Repository header for a browser extension that replaces emoji shortcodes while writing posts on X.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#164e63"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="face" x1="914" y1="82" x2="1128" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="36" fill="url(#bg)"/>
  <g opacity="0.16" fill="none" stroke="#e5e7eb" stroke-width="2">
    <path d="M80 80h1120"/>
    <path d="M80 340h1120"/>
    <path d="M184 40v340"/>
    <path d="M1096 40v340"/>
  </g>
  <g transform="translate(88 92)">
    <text x="0" y="56" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="800">X Emoji Shortcodes</text>
    <text x="0" y="114" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="500">Replace :emoji: shortcuts with real emojis while writing posts on X.</text>
    <g transform="translate(0 168)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700">
      <rect x="0" y="0" width="214" height="64" rx="18" fill="#f8fafc" fill-opacity="0.12"/>
      <text x="28" y="43" fill="#f8fafc">:party:</text>
      <path d="M246 32h84" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
      <path d="M330 32l-28-22M330 32l-28 22" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="378" y="45" fill="#f8fafc" font-size="44">🥳</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="824" y="78" width="312" height="264" rx="48" fill="#f8fafc" fill-opacity="0.12"/>
    <circle cx="936" cy="210" r="22" fill="#e5e7eb"/>
    <circle cx="936" cy="292" r="22" fill="#e5e7eb"/>
    <path d="M984 252h54" stroke="#e5e7eb" stroke-width="26" stroke-linecap="round"/>
    <circle cx="1080" cy="252" r="78" fill="url(#face)"/>
    <circle cx="1052" cy="232" r="9" fill="#111827"/>
    <circle cx="1106" cy="232" r="9" fill="#111827"/>
    <path d="M1049 280c17 22 47 22 64 0" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round"/>
    <path d="M1118 130l10 25 27 2-21 17 6 27-22-15-23 15 7-27-22-17 27-2 11-25z" fill="#f43f5e"/>
  </g>
